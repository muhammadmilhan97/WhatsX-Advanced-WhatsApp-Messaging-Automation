name: CI - Frontend & Backend (Optimized)

on:
  pull_request:
    branches:
      - develop
      - staging
      - main

jobs:
  frontend-ci:
    if: |
      contains(github.event.pull_request.changed_files, 'frontend/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: |
          cd frontend
          npm ci
          npm run build

  backend-ci:
    if: |
      contains(github.event.pull_request.changed_files, 'backend/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: |
          cd backend
          npm ci
          node -e "console.log('Backend CI OK')"
